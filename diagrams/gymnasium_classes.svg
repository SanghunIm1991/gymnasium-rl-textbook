<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <rect x="0" y="0" width="1000" height="730" fill="#ffffff"/>

  <!-- 表題 -->
  <text x="500" y="44" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#222">Gymnasium の主なクラス（第2章で使うもの）</text>

  <g font-family="monospace" fill="#222">

    <!-- ===== Env ===== -->
    <rect x="80" y="80" width="440" height="226" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
    <text x="300" y="101" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Env</text>
    <text x="300" y="117" font-size="11" fill="#666" text-anchor="middle">gymnasium.core</text>
    <line x1="80" y1="124" x2="520" y2="124" stroke="#333"/>
    <text font-size="12.5">
      <tspan x="92" y="143">+ observation_space: Space</tspan>
      <tspan x="92" y="161">+ action_space: Space</tspan>
      <tspan x="92" y="179">+ spec</tspan>
      <tspan x="92" y="197">+ unwrapped</tspan>
    </text>
    <line x1="80" y1="206" x2="520" y2="206" stroke="#333"/>
    <text font-size="12.5">
      <tspan x="92" y="225">+ reset(*, seed=None) -&gt; (observation, info)</tspan>
      <tspan x="92" y="243">+ step(action)</tspan>
      <tspan x="122" y="261">-&gt; (observation, reward, terminated, truncated, info)</tspan>
      <tspan x="92" y="279">+ render()</tspan>
      <tspan x="92" y="297">+ close()</tspan>
    </text>

    <!-- ===== Wrapper ===== -->
    <rect x="80" y="370" width="220" height="80" fill="#e3f2fd" stroke="#333" stroke-width="1.5"/>
    <text x="190" y="391" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Wrapper</text>
    <text x="190" y="407" font-size="11" fill="#666" text-anchor="middle">gymnasium.core</text>
    <line x1="80" y1="414" x2="300" y2="414" stroke="#333"/>
    <text x="92" y="437" font-size="12.5">+ env: Env</text>

    <!-- ===== CartPoleEnv ===== -->
    <rect x="325" y="370" width="230" height="80" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
    <text x="440" y="391" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CartPoleEnv</text>
    <text x="440" y="407" font-size="11" fill="#666" text-anchor="middle">gymnasium.envs.classic_control</text>
    <line x1="325" y1="414" x2="555" y2="414" stroke="#333"/>
    <text x="440" y="437" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">ラッパーではない環境の本体</text>

    <!-- ===== 具体的なラッパー ===== -->
    <g>
      <rect x="30" y="540" width="220" height="80" fill="#e3f2fd" stroke="#333" stroke-width="1.5"/>
      <text x="140" y="561" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TimeLimit</text>
      <text x="140" y="577" font-size="11" fill="#666" text-anchor="middle">gymnasium.wrappers</text>
      <line x1="30" y1="584" x2="250" y2="584" stroke="#333"/>
      <text x="140" y="607" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">回数の上限で打ち切る → <tspan font-family="monospace">truncated</tspan></text>

      <rect x="270" y="540" width="220" height="80" fill="#e3f2fd" stroke="#333" stroke-width="1.5"/>
      <text x="380" y="561" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">OrderEnforcing</text>
      <text x="380" y="577" font-size="11" fill="#666" text-anchor="middle">gymnasium.wrappers</text>
      <line x1="270" y1="584" x2="490" y2="584" stroke="#333"/>
      <text x="380" y="607" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle"><tspan font-family="monospace">reset</tspan> 前の <tspan font-family="monospace">step</tspan> を防ぐ</text>

      <rect x="510" y="540" width="220" height="80" fill="#e3f2fd" stroke="#333" stroke-width="1.5"/>
      <text x="620" y="561" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PassiveEnvChecker</text>
      <text x="620" y="577" font-size="11" fill="#666" text-anchor="middle">gymnasium.wrappers</text>
      <line x1="510" y1="584" x2="730" y2="584" stroke="#333"/>
      <text x="620" y="607" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">API の約束を確かめる</text>

      <rect x="750" y="540" width="220" height="80" fill="#e3f2fd" stroke="#333" stroke-width="1.5"/>
      <text x="860" y="561" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">RecordEpisodeStatistics</text>
      <text x="860" y="577" font-size="11" fill="#666" text-anchor="middle">gymnasium.wrappers</text>
      <line x1="750" y1="584" x2="970" y2="584" stroke="#333"/>
      <text x="860" y="607" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">報酬の合計と長さを記録</text>
    </g>

    <!-- ===== Space ===== -->
    <rect x="700" y="100" width="220" height="106" fill="#e8f5e9" stroke="#333" stroke-width="1.5"/>
    <text x="810" y="121" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Space</text>
    <text x="810" y="137" font-size="11" fill="#666" text-anchor="middle">gymnasium.spaces</text>
    <line x1="700" y1="144" x2="920" y2="144" stroke="#333"/>
    <text font-size="12.5">
      <tspan x="712" y="163">+ sample()</tspan>
      <tspan x="712" y="181">+ contains(x)</tspan>
      <tspan x="712" y="199">+ seed(seed)</tspan>
    </text>

    <!-- ===== Box ===== -->
    <rect x="630" y="280" width="170" height="166" fill="#e8f5e9" stroke="#333" stroke-width="1.5"/>
    <text x="715" y="301" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Box</text>
    <text x="715" y="317" font-size="11" fill="#666" text-anchor="middle">gymnasium.spaces</text>
    <line x1="630" y1="324" x2="800" y2="324" stroke="#333"/>
    <text font-size="12.5">
      <tspan x="642" y="343">+ low</tspan>
      <tspan x="642" y="361">+ high</tspan>
      <tspan x="642" y="379">+ shape</tspan>
      <tspan x="642" y="397">+ dtype</tspan>
    </text>
    <line x1="630" y1="406" x2="800" y2="406" stroke="#333" stroke-dasharray="3,3"/>
    <text x="715" y="424" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">CartPole の観測</text>
    <text x="715" y="440" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">（4つの実数）</text>

    <!-- ===== Discrete ===== -->
    <rect x="820" y="280" width="160" height="130" fill="#e8f5e9" stroke="#333" stroke-width="1.5"/>
    <text x="900" y="301" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Discrete</text>
    <text x="900" y="317" font-size="11" fill="#666" text-anchor="middle">gymnasium.spaces</text>
    <line x1="820" y1="324" x2="980" y2="324" stroke="#333"/>
    <text font-size="12.5">
      <tspan x="832" y="343">+ n</tspan>
      <tspan x="832" y="361">+ start</tspan>
    </text>
    <line x1="820" y1="370" x2="980" y2="370" stroke="#333" stroke-dasharray="3,3"/>
    <text x="900" y="388" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">CartPole の行動</text>
    <text x="900" y="404" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">（0 か 1）</text>
  </g>

  <!-- ===== 継承の線（黒、白抜きの三角） ===== -->
  <g fill="none" stroke="#333" stroke-width="1.5">
    <!-- Wrapper, CartPoleEnv → Env -->
    <polyline points="300,318 300,340"/>
    <polyline points="190,370 190,340 440,340 440,370"/>
    <!-- 具体的なラッパー → Wrapper -->
    <polyline points="190,462 190,505"/>
    <polyline points="140,540 140,505 860,505 860,540"/>
    <polyline points="380,505 380,540"/>
    <polyline points="620,505 620,540"/>
    <!-- Box, Discrete → Space -->
    <polyline points="810,218 810,245"/>
    <polyline points="715,280 715,245 900,245 900,280"/>
  </g>
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <polygon points="300,306 292,318 308,318"/>
    <polygon points="190,450 182,462 198,462"/>
    <polygon points="810,206 802,218 818,218"/>
  </g>

  <!-- ===== 保持の線（青、ひし形 → 矢印） Wrapper が env を1つ持つ ===== -->
  <g stroke="#1565c0" stroke-width="2" fill="none">
    <polyline points="60,410 40,410 40,200 80,200"/>
    <polyline points="70,194 80,200 70,206"/>
  </g>
  <polygon points="80,410 70,404 60,410 70,416" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="34" y="310" font-family="monospace" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="end">env</text>

  <!-- ===== 関連の線（緑、矢印） Env が Space を2つ持つ ===== -->
  <g stroke="#2e7d32" stroke-width="1.5" fill="none">
    <line x1="520" y1="132" x2="699" y2="132"/>
    <line x1="520" y1="182" x2="699" y2="182"/>
  </g>
  <g stroke="#2e7d32" stroke-width="1.5" fill="none">
    <polyline points="689,126 699,132 689,138"/>
    <polyline points="689,176 699,182 689,188"/>
  </g>
  <text x="610" y="125" font-family="monospace" font-size="12.5" fill="#2e7d32" text-anchor="middle">observation_space</text>
  <text x="610" y="175" font-family="monospace" font-size="12.5" fill="#2e7d32" text-anchor="middle">action_space</text>

  <!-- ===== 凡例 ===== -->
  <g font-family="sans-serif" font-size="12" fill="#333">
    <rect x="30" y="652" width="700" height="40" fill="#ffffff" stroke="#bbb"/>
    <text x="42" y="677" font-weight="bold">凡例</text>
    <!-- 継承 -->
    <line x1="80" y1="672" x2="118" y2="672" stroke="#333" stroke-width="1.5"/>
    <polygon points="130,672 118,664 118,680" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="138" y="677">継承（子 → 親）</text>
    <!-- 保持 -->
    <polygon points="250,672 260,666 270,672 260,678" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
    <line x1="270" y1="672" x2="310" y2="672" stroke="#1565c0" stroke-width="2"/>
    <polyline points="300,666 310,672 300,678" fill="none" stroke="#1565c0" stroke-width="2"/>
    <text x="318" y="677">保持（ラッパーが環境を包む）</text>
    <!-- 関連 -->
    <line x1="500" y1="672" x2="540" y2="672" stroke="#2e7d32" stroke-width="1.5"/>
    <polyline points="530,666 540,672 530,678" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="548" y="677">関連（属性として持つ）</text>
  </g>

  <text x="970" y="712" font-family="sans-serif" font-size="11" fill="#777" text-anchor="end">Gymnasium 1.3.0（2026-10-02 確認）</text>
</svg>
